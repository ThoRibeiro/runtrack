# Stack locale. Versions figées : un « latest » qui bouge sous les pieds fait échouer
# un test d'intégration sans qu'aucune ligne de code n'ait changé.
services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: runtrack-postgres
    environment:
      POSTGRES_DB: runtrack
      POSTGRES_USER: runtrack
      POSTGRES_PASSWORD: runtrack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtrack -d runtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dragonfly, pas Redis : les tests d'intégration tapent la même image que la prod,
  # sans quoi on validerait des commandes que Dragonfly n'implémente pas pareil.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    container_name: runtrack-dragonfly
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    command: ["--logtostderr", "--maxmemory=1gb"]
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Le serveur de messagerie du poste : il accepte tout et n'expédie rien. Les messages se
  # lisent sur http://localhost:8025 — confirmation d'adresse et mot de passe oublié se
  # testent donc en entier sans relais réel et sans risquer d'écrire à quelqu'un.
  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: runtrack-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Le fournisseur d'identité. `start-dev` garde sa base en mémoire : le realm est réimporté
  # à chaque démarrage depuis `keycloak/realm-runtrack.json`, ce qui rend le poste local
  # reproductible et interdit d'y bricoler une configuration qui ne serait nulle part.
  # La production, elle, exige `start` et une vraie base — voir docs/decisions-keycloak.md.
  #
  # 8180 et non 8080 : l'API tient déjà 8080, le front 8081.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: runtrack-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # L'image ne porte ni curl ni wget : on teste le port avec le /dev/tcp du shell.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  dragonfly-data:
  mailpit-data:
