spring:
  jpa:
    # Le schéma vient de Flyway. `validate` fait échouer le test si une entité et sa table
    # divergent — c'est précisément ce qu'on veut détecter ici.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration/user

  # Ces tests portent sur la persistance. Laisser le cache actif sans Dragonfly ferait
  # passer chaque appel par le chemin dégradé — vert, mais ne testant plus rien du cache.
runtrack:
  cache:
    enabled: false
