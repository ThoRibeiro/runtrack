spring:
  application:
    name: runtrack
  threads:
    virtual:
      enabled: true
  profiles:
    default: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
