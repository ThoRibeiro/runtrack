name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, tests et seuil de couverture
        run: mvn -B --no-transfer-progress verify

      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

      - name: Assembler le site
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p site/coverage
          cp -r docs/site/. site/
          # Écrite par OpenApiIT, après que ses assertions ont vérifié le contenu : le fichier
          # publié est exactement celui que le build a validé.
          cp runtrack-app/target/openapi/openapi.json site/openapi.json
          cp -r runtrack-coverage/target/site/jacoco-aggregate/. site/coverage/
          # Sans ce fichier, GitHub Pages passe le site dans Jekyll, qui ignore tout dossier
          # commençant par un underscore — ce que produit le rapport JaCoCo.
          touch site/.nojekyll

      - name: Publier l'artefact du site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    name: Déployer sur GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
