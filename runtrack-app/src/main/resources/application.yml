spring:
  application:
    name: runtrack
  threads:
    virtual:
      enabled: true
  profiles:
    default: local

  datasource:
    url: ${RUNTRACK_DB_URL:jdbc:postgresql://localhost:5432/runtrack}
    username: ${RUNTRACK_DB_USER:runtrack}
    password: ${RUNTRACK_DB_PASSWORD:runtrack}

  servlet:
    multipart:
      # La photo de profil, et rien d'autre : la limite du cas d'usage est de 2 Mo, celle
      # du transport la double pour laisser passer l'enveloppe multipart. Au-delà, la
      # requête est refusée avant d'atteindre le disque de travail.
      max-file-size: 4MB
      max-request-size: 4MB

  jpa:
    # Le schéma appartient à Flyway. `validate` fait échouer le démarrage si une entité
    # et sa table divergent, plutôt que de laisser Hibernate « réparer » en silence.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      # Dragonfly parle le protocole RESP : le client Redis convient, l'image non.
      host: ${RUNTRACK_REDIS_HOST:localhost}
      port: ${RUNTRACK_REDIS_PORT:6379}
      timeout: 2s
      # Pas de pool de connexions : Lettuce multiplexe les commandes sur une connexion
      # partagée et thread-safe. Un pool n'apporterait rien ici, et exigerait commons-pool2.

  modulith:
    events:
      # Le rejeu au redémarrage du §7 : ce qui n'avait pas abouti quand le pod est tombé est
      # repris au suivant. Sans cette ligne, le registre persiste l'événement mais ne le
      # ressort jamais — l'outbox serait une archive, pas une garantie de livraison.
      republish-outstanding-events-on-restart: true

  security:
    filter:
      # Sans `async` : la reprise asynchrone n'est pas une requête, c'est la fin de celle qui a
      # déjà traversé la chaîne. La rejouer sur un flux SSE ouvert depuis plus longtemps que la
      # durée de vie d'un jeton (15 min) la trouve anonyme, la refuse, et le refus arrive après
      # que la réponse est émise — d'où un ERROR à chaque fermeture d'abonnement.
      dispatcher-types: request,error

  flyway:
    enabled: true
    # Un emplacement par module et une centaine par module : deux modules avancent alors en
    # parallèle, et une base qui a déjà appliqué `801` reçoit encore une `103`. Sans cela,
    # plus aucun module « bas » ne peut évoluer une fois qu'un module « haut » est déployé.
    #
    # Sans danger ici : aucune table n'a de clé étrangère vers un autre module (cf. V201),
    # donc l'ordre relatif de deux migrations de modules différents ne signifie rien.
    out-of-order: true
    # Un emplacement par module : chaque table appartient à son module, ses migrations
    # aussi. Les versions sont réparties par centaines pour éviter les collisions.
    locations:
      - classpath:db/migration/platform
      - classpath:db/migration/user
      - classpath:db/migration/auth
      - classpath:db/migration/social
      - classpath:db/migration/course
      - classpath:db/migration/sharing
      - classpath:db/migration/engagement
      - classpath:db/migration/feed
      - classpath:db/migration/notification

runtrack:
  events:
    # Cadence de la reprise. Le recul entre deux tentatives, lui, est exponentiel et vit dans
    # EventPublicationRetry : c'est une règle, pas un réglage d'exploitation.
    retry-interval: 1m

  ratelimit:
    # §9. L'écart entre les deux premiers est délibéré : une adresse IP est partagée — un
    # foyer, un bureau, un opérateur derrière un NAT —, un compte ne l'est pas.
    login-per-ip: 200
    login-per-account: 10
    login-window: 15m
    ingest-batches-per-activity: 60
    ingest-window: 1m
    comments-per-author: 20
    comments-window: 1h

  push:
    # Le choix de l'envoyeur se fait ici, pas dans un `if` : `logging` écrit ce qu'il aurait
    # envoyé, `fcm` parle à Firebase. Le défaut est volontairement le premier — un poste de
    # développement sans compte de service doit démarrer.
    provider: ${RUNTRACK_PUSH_PROVIDER:logging}
    project-id: ${RUNTRACK_FCM_PROJECT_ID:}
    # Un chemin, jamais la clé elle-même (§9).
    credentials-location: ${RUNTRACK_FCM_CREDENTIALS:}
    # La borne du §7. Elle ne peut pas être dépassée, seulement abaissée.
    batch-size: 500
    timeout: 10s

  cache:
    enabled: true
    # Part d'aléa ajoutée à chaque TTL : mille clés écrites ensemble ne doivent pas
    # expirer ensemble, sinon la charge repart en base d'un bloc.
    jitter-ratio: 0.2
    user-ttl: 10m
    social-ttl: 5m
    activity-summary-ttl: 24h
    counters-ttl: 1m
    share-token-ttl: 15m
    feed-head-ttl: 30s

  realtime:
    # Longueur du journal d'une course, en nombre d'entrées. C'est un garde-fou mémoire, pas
    # un quota : ce qui dépasse a de toute façon été reçu ou remplacé par l'instantané.
    stream-max-length: 1000
    # Après la fin d'une course, le journal survit le temps qu'un client coupé se reconnecte
    # avec son Last-Event-ID et reçoive la fin de ce qu'il regardait.
    stream-retention: 5m
    # Sans battement, un proxy ferme une connexion SSE silencieuse — ce qui arrive dès qu'un
    # coureur s'arrête à un feu.
    heartbeat: 15s
    emitter-timeout: 4h
    # Doit rester nettement au-dessus de LiveActivityStream.SNAPSHOT_POINTS : l'instantané
    # entre dans cette file avant le premier événement en direct.
    subscriber-queue-capacity: 512
    # Doit rester **strictement sous** `spring.data.redis.timeout` : le XREAD est bloquant, et
    # Lettuce compte son propre délai sur la même commande. À égalité, Dragonfly répond à
    # l'instant où le client abandonne, et chaque tour de boucle sans message lève un
    # RedisCommandTimeoutException — en continu dès qu'une course est suivie.
    poll-timeout: 1s

  auth:
    jwt:
      # Chemins, jamais de clé en dur. Sans eux, une paire éphémère est tirée au démarrage
      # et les jetons ne survivent pas à un redémarrage : une configuration incomplète se
      # voit tout de suite au lieu de passer inaperçue.
      private-key-location: ${RUNTRACK_JWT_PRIVATE_KEY:}
      public-key-location: ${RUNTRACK_JWT_PUBLIC_KEY:}
      access-token-lifetime: 15m
      issuer: runtrack

springdoc:
  # /swagger-ui.html redirige vers cette page ; la fixer évite qu'une montée de version
  # déplace l'URL que tout le monde a mise en favori.
  swagger-ui:
    path: /swagger-ui.html
    # L'UI n'affiche qu'un groupe à la fois, et prend le premier de la liste — « 1-auth » —
    # sans ceci : on croit alors que l'API se limite à l'authentification. Elle s'ouvre donc
    # sur le groupe complet, et le sélecteur en haut de page mène aux ressources une à une.
    urls-primary-name: 8-tout
    display-request-duration: true
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  # La description est publique : c'est un contrat, pas un secret. Ce qu'elle documente reste
  # protégé par la chaîne de sécurité.
  show-actuator: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith,eventpublications,metrics
  endpoint:
    health:
      probes:
        # Liveness et readiness séparées (§12) : Kubernetes redémarre un pod dont la liveness
        # tombe, mais se contente de le sortir du service si sa readiness tombe. Les confondre
        # fait redémarrer une instance parce que Dragonfly rame, ce qui n'arrange rien.
        enabled: true
      show-details: when-authorized
      group:
        # La liveness ne regarde que la JVM : dépendre de la base y ferait redémarrer tous les
        # pods au premier hoquet de Postgres, en cascade.
        liveness:
          include: livenessState
        # La readiness regarde ce sans quoi l'instance ne peut pas servir.
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: runtrack
  observations:
    key-values:
      application: runtrack
